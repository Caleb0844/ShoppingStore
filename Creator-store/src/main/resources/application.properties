spring.application.name=Creator-store
spring.config.import=optional:file:.env[.properties]

# Database config
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/creator_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Deborahdebs254#}

# ORM config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT config: JWT_SECRET must be a Base64-encoded secret of at least 256 bits.
modestoe.jwt.secret=${JWT_SECRET}
modestoe.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
