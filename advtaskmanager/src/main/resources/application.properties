spring.application.name=advtaskmanager
spring.config.import=optional:file:.env[.properties]

# Database config
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/advancedtm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Deborahdebs254#}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ORM config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Authentication
auth.enabled=${AUTH_ENABLED:false}
auth.jwt.secret=${AUTH_JWT_SECRET:change-me-to-a-long-secret-that-is-at-least-32-chars}
auth.jwt.expiration-ms=${AUTH_JWT_EXPIRATION_MS:86400000}
